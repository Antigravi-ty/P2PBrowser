[package]
name = "p2p-browser"
version = "1.0.0"
description = "P2P WebRTC SOCKS5 Proxy Browser"
edition = "2021"

[lib]
name = "p2p_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["devtools"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
url = "2"
tauri = { version = "2", features = ["unstable", "macos-proxy"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "stream"] }
open = "5"
percent-encoding = "2"
futures-util = "0.3"
